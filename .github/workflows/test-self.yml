name: Test self

# Purpose: qualify generic Git bootstrap, status, update, launcher safety, and dependency closure.
# Scope: repository qualification workflow.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_TOOL_REF: dc94cf120ea4a196c9fc3daff4d22984ea4481c1

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create clean consumer fixture
        shell: bash
        env:
          TOOL_BRANCH: ${{ github.head_ref || 'main' }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/git-project-fixture"
          mkdir -p "$repo"
          cp fixture/project.yml fixture/project.example.yml "$repo/"

          git -C "$repo" init
          git -C "$repo" config user.name tool-git-project-test
          git -C "$repo" config user.email tool-git-project-test@example.invalid
          git -C "$repo" submodule add https://github.com/brainboxemb/tool.git-project.git tools/tool.git-project
          git -C "$repo/tools/tool.git-project" fetch origin "$TOOL_BRANCH"
          git -C "$repo/tools/tool.git-project" checkout --detach "origin/$TOOL_BRANCH"
          tool_sha="$(git -C "$repo/tools/tool.git-project" rev-parse HEAD)"
          bash "$repo/tools/tool.git-project/support/managed-consumer-launchers.sh" refresh --repo "$repo"

          # Commit the declared dependency as a gitlink as a real consumer does.
          # A normal clone will contain the gitlink registration but not the
          # dependency worktree until generic bootstrap initializes it.
          git -C "$repo" submodule add https://github.com/brainboxemb/tool.java-project.git tools/tool.java-project
          git -C "$repo/tools/tool.java-project" fetch origin "$JAVA_TOOL_REF"
          git -C "$repo/tools/tool.java-project" checkout --detach "$JAVA_TOOL_REF"

          git -C "$repo" add project.yml project.example.yml bootstrap.ps1 bootstrap.sh update.ps1 update.sh .gitmodules tools/tool.git-project tools/tool.java-project
          git -C "$repo" commit -m fixture

          # Emulate a normal clone without --recurse-submodules: both committed
          # gitlinks exist, but neither worktree is initialized.
          git -C "$repo" submodule deinit -f -- tools/tool.git-project tools/tool.java-project
          rm -rf "$repo/tools/tool.git-project" "$repo/tools/tool.java-project"

          echo "FIXTURE_REPO=$repo" >> "$GITHUB_ENV"
          echo "EXPECTED_TOOL_SHA=$tool_sha" >> "$GITHUB_ENV"
      - name: Bootstrap from project root
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIXTURE_REPO"
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$EXPECTED_TOOL_SHA"
          test "$(git -C tools/tool.java-project rev-parse HEAD)" = "$JAVA_TOOL_REF"
          git ls-files --stage -- tools/tool.git-project | grep '^160000 '
          git ls-files --stage -- tools/tool.java-project | grep '^160000 '
          tools/tool.git-project/git-project.sh status --repo .
      - name: Root update launcher is idempotent
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIXTURE_REPO"
          ./update.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$EXPECTED_TOOL_SHA"
          test "$(git -C tools/tool.java-project rev-parse HEAD)" = "$JAVA_TOOL_REF"
      - name: Bootstrap engine gitlink is visible and enforced
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIXTURE_REPO"

          ./update.sh status > bootstrap-status.log 2>&1
          cat bootstrap-status.log
          grep -Eq '^tool\.git-project[[:space:]]+BOOTSTRAP state=OK' bootstrap-status.log

          stale_sha="$(git -C tools/tool.git-project rev-parse "$EXPECTED_TOOL_SHA^")"
          git -C tools/tool.git-project checkout --detach "$stale_sha" >/dev/null
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$stale_sha"

          if ./update.sh status > bootstrap-stale.log 2>&1; then
            cat bootstrap-stale.log
            echo "status unexpectedly accepted a stale bootstrap engine" >&2
            exit 1
          fi
          cat bootstrap-stale.log
          grep -Eq '^tool\.git-project[[:space:]]+BOOTSTRAP state=DIFF' bootstrap-stale.log
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$stale_sha"

          ./update.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$EXPECTED_TOOL_SHA"

          printf '\nbootstrap local test change\n' >> tools/tool.git-project/README.md
          if ./update.sh > bootstrap-dirty.log 2>&1; then
            cat bootstrap-dirty.log
            echo "update unexpectedly accepted a dirty bootstrap engine" >&2
            exit 1
          fi
          cat bootstrap-dirty.log
          grep -q "Bootstrap engine 'tool.git-project' has local changes" bootstrap-dirty.log
          grep -q "bootstrap local test change" tools/tool.git-project/README.md
          git -C tools/tool.git-project reset --hard HEAD >/dev/null

          rm -f bootstrap-status.log bootstrap-stale.log bootstrap-dirty.log
      - name: Managed launcher drift and local patch are visible
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIXTURE_REPO"
          sed -i 's/^# Managed-Source-Revision:.*/# Managed-Source-Revision: stale-test-revision/' update.sh
          tools/tool.git-project/git-project.sh status --repo . > launcher-drift.log 2>&1
          cat launcher-drift.log
          grep -q "Managed launcher drift" launcher-drift.log
          git checkout -- update.sh
          sed -i 's/^# Managed-Local-Patch: none/# Managed-Local-Patch: fixture-local-change/' update.sh
          printf '\n# retained local patch\n' >> update.sh
          tools/tool.git-project/git-project.sh refresh-launchers --repo . > launcher-patch.log 2>&1
          cat launcher-patch.log
          grep -q "declared local patch" launcher-patch.log
          grep -q "retained local patch" update.sh
          git checkout -- update.sh
          rm -f launcher-drift.log launcher-patch.log
      - name: Dirty dependency is protected
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIXTURE_REPO"
          printf '\nlocal test change\n' >> tools/tool.java-project/README.md
          if ./update.sh > dirty-update.log 2>&1; then
            cat dirty-update.log
            echo "update unexpectedly succeeded for a dirty dependency" >&2
            exit 1
          fi
          cat dirty-update.log
          grep -q "has local changes" dirty-update.log
          git -C tools/tool.java-project reset --hard HEAD

      - name: Transitive external dependency contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/transitive-external-closure.sh "$FIXTURE_REPO"


  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create clean consumer fixture
        shell: pwsh
        env:
          TOOL_BRANCH: ${{ github.head_ref || 'main' }}
        run: |
          $repo = Join-Path $env:RUNNER_TEMP "git-project-fixture"
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          Copy-Item fixture/project.yml, fixture/project.example.yml -Destination $repo

          git -C $repo init
          git -C $repo config user.name tool-git-project-test
          git -C $repo config user.email tool-git-project-test@example.invalid
          git -C $repo submodule add https://github.com/brainboxemb/tool.git-project.git tools/tool.git-project
          git -C "$repo/tools/tool.git-project" fetch origin $env:TOOL_BRANCH
          git -C "$repo/tools/tool.git-project" checkout --detach "origin/$env:TOOL_BRANCH"
          $toolSha = (git -C "$repo/tools/tool.git-project" rev-parse HEAD).Trim()
          & "$repo\tools\tool.git-project\support\managed-consumer-launchers.ps1" refresh -RepoRoot $repo

          git -C $repo submodule add https://github.com/brainboxemb/tool.java-project.git tools/tool.java-project
          git -C "$repo/tools/tool.java-project" fetch origin $env:JAVA_TOOL_REF
          git -C "$repo/tools/tool.java-project" checkout --detach $env:JAVA_TOOL_REF

          git -C $repo add project.yml project.example.yml bootstrap.ps1 bootstrap.sh update.ps1 update.sh .gitmodules tools/tool.git-project tools/tool.java-project
          git -C $repo commit -m fixture

          git -C $repo submodule deinit -f -- tools/tool.git-project tools/tool.java-project
          Remove-Item -Recurse -Force (Join-Path $repo "tools/tool.git-project") -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $repo "tools/tool.java-project") -ErrorAction SilentlyContinue

          "FIXTURE_REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_TOOL_SHA=$toolSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bootstrap from project root
        shell: pwsh
        run: |
          Push-Location $env:FIXTURE_REPO
          try {
            .\bootstrap.ps1
            $toolActual = (git -C tools/tool.git-project rev-parse HEAD).Trim()
            if ($toolActual -ne $env:EXPECTED_TOOL_SHA) { throw "Unexpected bootstrap tool SHA: $toolActual" }
            $javaActual = (git -C tools/tool.java-project rev-parse HEAD).Trim()
            if ($javaActual -ne $env:JAVA_TOOL_REF) { throw "Unexpected Java tool SHA: $javaActual" }
            $toolEntry = git ls-files --stage -- tools/tool.git-project
            $javaEntry = git ls-files --stage -- tools/tool.java-project
            if ($toolEntry -notmatch '^160000\s') { throw "Bootstrap tool is not a gitlink." }
            if ($javaEntry -notmatch '^160000\s') { throw "Java tool is not a gitlink." }
            .\tools\tool.git-project\git-project.ps1 status -RepoRoot .
          } finally {
            Pop-Location
          }
      - name: Root update launcher is idempotent
        shell: pwsh
        run: |
          Push-Location $env:FIXTURE_REPO
          try {
            .\update.ps1
            $toolActual = (git -C tools/tool.git-project rev-parse HEAD).Trim()
            if ($toolActual -ne $env:EXPECTED_TOOL_SHA) { throw "Unexpected bootstrap tool SHA after update: $toolActual" }
            $javaActual = (git -C tools/tool.java-project rev-parse HEAD).Trim()
            if ($javaActual -ne $env:JAVA_TOOL_REF) { throw "Unexpected Java tool SHA after update: $javaActual" }
          } finally {
            Pop-Location
          }
      - name: Bootstrap engine gitlink is visible and enforced
        shell: pwsh
        run: |
          Push-Location $env:FIXTURE_REPO
          try {
            $statusOutput = (& .\update.ps1 status 6>&1 3>&1 2>&1 | Out-String)
            Write-Host $statusOutput
            if ($statusOutput -notmatch 'tool\.git-project\s+BOOTSTRAP state=OK') {
              throw "Bootstrap OK status row missing."
            }

            $staleSha = (git -C tools/tool.git-project rev-parse "$env:EXPECTED_TOOL_SHA^").Trim()
            git -C tools/tool.git-project checkout --detach $staleSha | Out-Null
            $beforeStatus = (git -C tools/tool.git-project rev-parse HEAD).Trim()
            if ($beforeStatus -ne $staleSha) { throw "Unable to prepare stale bootstrap fixture." }

            $statusFailed = $false
            try {
              .\update.ps1 status
            } catch {
              $statusFailed = $true
              $message = $_ | Out-String
              Write-Host $message
              if ($message -notmatch 'committed gitlink') { throw }
            }
            if (-not $statusFailed) { throw "status unexpectedly accepted a stale bootstrap engine" }
            $afterStatus = (git -C tools/tool.git-project rev-parse HEAD).Trim()
            if ($afterStatus -ne $staleSha) { throw "Read-only status changed the bootstrap engine." }

            .\update.ps1
            $aligned = (git -C tools/tool.git-project rev-parse HEAD).Trim()
            if ($aligned -ne $env:EXPECTED_TOOL_SHA) { throw "Update did not restore the committed bootstrap gitlink." }

            Add-Content -Path tools/tool.git-project/README.md -Value "bootstrap local test change"
            $dirtyFailed = $false
            try {
              .\update.ps1
            } catch {
              $dirtyFailed = $true
              if ($_.Exception.Message -notmatch "Bootstrap engine 'tool.git-project' has local changes") { throw }
              Write-Host $_.Exception.Message
            }
            if (-not $dirtyFailed) { throw "update unexpectedly accepted a dirty bootstrap engine" }
            if ((Get-Content tools/tool.git-project/README.md -Raw) -notmatch 'bootstrap local test change') {
              throw "Dirty bootstrap change was overwritten."
            }
            git -C tools/tool.git-project reset --hard HEAD | Out-Null
          } finally {
            Pop-Location
          }
      - name: Managed launcher drift and local patch are visible
        shell: pwsh
        run: |
          Push-Location $env:FIXTURE_REPO
          try {
            $path = Join-Path $env:FIXTURE_REPO "update.ps1"
            $text = [System.IO.File]::ReadAllText($path)
            $text = [regex]::Replace($text, '(?m)^# Managed-Source-Revision:.*$', '# Managed-Source-Revision: stale-test-revision')
            [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
            $output = (& .\tools\tool.git-project\git-project.ps1 status -RepoRoot . 3>&1 2>&1 | Out-String)
            Write-Host $output
            if ($output -notmatch 'Managed launcher drift') { throw "Expected launcher drift warning." }
            git checkout -- update.ps1
            $text = [System.IO.File]::ReadAllText($path)
            $text = $text.Replace('# Managed-Local-Patch: none', '# Managed-Local-Patch: fixture-local-change') + "`n# retained local patch`n"
            [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
            $patchOutput = (& .\tools\tool.git-project\git-project.ps1 refresh-launchers -RepoRoot . 3>&1 2>&1 | Out-String)
            Write-Host $patchOutput
            if ($patchOutput -notmatch 'declared local patch') { throw "Expected local patch preservation warning." }
            if ([System.IO.File]::ReadAllText($path) -notmatch 'retained local patch') { throw "Local patch was overwritten." }
            git checkout -- update.ps1
          } finally {
            Pop-Location
          }
      - name: Dirty dependency is protected
        shell: pwsh
        run: |
          Push-Location $env:FIXTURE_REPO
          try {
            Add-Content -Path tools/tool.java-project/README.md -Value "local test change"
            $failedAsExpected = $false
            try {
              .\update.ps1
            } catch {
              $failedAsExpected = $true
              if ($_.Exception.Message -notmatch 'local changes') { throw }
              Write-Host $_.Exception.Message
            }
            if (-not $failedAsExpected) { throw "update unexpectedly succeeded for a dirty dependency" }
            git -C tools/tool.java-project reset --hard HEAD
          } finally {
            Pop-Location
          }
      - name: Transitive external dependency contract
        shell: pwsh
        run: .\tests\transitive-external-closure.ps1 -RepoRoot $env:FIXTURE_REPO
