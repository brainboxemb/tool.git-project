name: Release tool.git-project

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable release tag, e.g. v0.2.0'
        required: true
        type: string
      release_sha:
        description: 'Exact already-verified main commit SHA to tag'
        required: true
        type: string
  push:
    branches:
      - 'release-request/**'

permissions:
  contents: write
  actions: write

jobs:
  release:
    # tool.git-project uses its own generic release lifecycle locally. External
    # repositories consume the same workflow through a released tool tag.
    uses: ./.github/workflows/reusable-release.yml
    with:
      version: ${{ inputs.version || '' }}
      release_sha: ${{ inputs.release_sha || '' }}
      required_main_workflows: |
        self-test.yml
        pr-preview-cleanup-test.yml
        generated-output-publish-test.yml
        generated-output-same-job-test.yml
        reusable-release-test.yml
        moon-orchestration-test.yml
        execution-evidence-schema-test.yml
      tagged_verification_workflow: generated-output-same-job-test.yml
      wait_for_tagged_verification: true
      create_github_release: true
