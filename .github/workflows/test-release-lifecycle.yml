name: Test release

# Purpose: qualify generic release-request validation and dry-run lifecycle behavior without publishing a real release.
# Scope: repository qualification workflow.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dry-run:
    # Exercise the same reusable release workflow without creating tags or releases.
    uses: ./.github/workflows/reusable-release.yml
    with:
      release_sha: ${{ github.sha }}
      dry_run: true
