name: Test generic release lifecycle
# Contract: generic release request validation and dry-run lifecycle remain side-effect free and deterministic. See docs/testing.md.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dry-run:
    # Exercise the same reusable release workflow without creating tags or releases.
    uses: ./.github/workflows/reusable-release.yml
    with:
      release_sha: ${{ github.sha }}
      dry_run: true
