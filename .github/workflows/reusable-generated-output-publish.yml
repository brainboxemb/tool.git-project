name: Reusable generated output publication

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Actions artifact containing the prepared generated-output tree
        required: true
        type: string
      branch_suffix:
        description: Single validated suffix below dev/pr-N, prod, or rel/vX.Y.Z
        required: true
        type: string
      source_revision:
        description: Optional exact source revision override. Normally inferred from the triggering PR/head/tag context.
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  publish:
    name: Publish generated output
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: generated-output-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.branch_suffix }}
      cancel-in-progress: true

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download prepared output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/generated-output-publication

      - name: Publish generated branch
        shell: bash
        env:
          BRANCH_SUFFIX: ${{ inputs.branch_suffix }}
          SOURCE_REVISION_INPUT: ${{ inputs.source_revision }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_dir="${RUNNER_TEMP}/generated-output-publication"
          if [[ ! -d "$publish_dir" ]] || ! find "$publish_dir" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "ERROR: prepared generated-output artifact is empty" >&2
            exit 1
          fi

          if [[ ! "$BRANCH_SUFFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "ERROR: invalid generated-output branch suffix: $BRANCH_SUFFIX" >&2
            exit 1
          fi

          source_revision="$SOURCE_REVISION_INPUT"
          if [[ -z "$source_revision" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              source_revision="$PR_EVENT_HEAD_SHA"
            else
              source_revision="$GITHUB_SHA"
            fi
          fi
          if [[ ! "$source_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: source revision must be an exact 40-character commit SHA" >&2
            exit 1
          fi

          publication_context=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || -z "$PR_HEAD_REF" ]]; then
              echo "ERROR: missing or invalid pull-request context" >&2
              exit 1
            fi
            target_branch="dev/pr-${PR_NUMBER}/${BRANCH_SUFFIX}"
            publication_context="pull request #${PR_NUMBER}"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            target_branch="prod/${BRANCH_SUFFIX}"
            publication_context="main"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: release tag must match vX.Y.Z: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            target_branch="rel/${GITHUB_REF_NAME}/${BRANCH_SUFFIX}"
            publication_context="release tag ${GITHUB_REF_NAME}"
          else
            echo "ERROR: generated-output publication is only allowed for same-repository pull requests, main, or vX.Y.Z release tags; got $GITHUB_REF" >&2
            exit 1
          fi

          current_source_revision() {
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              git ls-remote origin "refs/heads/${PR_HEAD_REF}" | awk 'NR == 1 { print $1 }'
            elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              git ls-remote origin 'refs/heads/main' | awk 'NR == 1 { print $1 }'
            else
              # Release tags are immutable in this lifecycle. actions/checkout resolves
              # an annotated or lightweight tag to its commit, so HEAD is authoritative.
              git rev-parse HEAD
            fi
          }

          current_revision="$(current_source_revision)"
          if [[ ! "$current_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: could not resolve current source revision for ${publication_context}" >&2
            exit 1
          fi
          if [[ "$source_revision" != "$current_revision" ]]; then
            echo "Skipping stale generated-output publication for ${publication_context}: run source ${source_revision}, current source ${current_revision}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GITHUB_TOKEN" > ~/.git-credentials

          git switch --orphan generated-output-publication
          git clean -fdx
          cp -a "$publish_dir/." ./

          git add .
          if git diff --cached --quiet; then
            echo "ERROR: prepared generated-output artifact produced no publishable files" >&2
            exit 1
          fi
          git commit -m "Publish generated output to ${target_branch}"

          # Re-check immediately before the destructive force-push. This closes the
          # normal race window when a newer PR/main revision appears during staging.
          latest_revision="$(current_source_revision)"
          if [[ "$source_revision" != "$latest_revision" ]]; then
            echo "Skipping stale generated-output publication for ${publication_context}: source advanced to ${latest_revision} before push."
            exit 0
          fi

          git push --force origin "HEAD:${target_branch}"

          echo "Published generated output from ${source_revision} to ${target_branch}"
