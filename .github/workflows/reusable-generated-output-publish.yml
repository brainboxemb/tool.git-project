name: Reusable output publish

# Purpose: publish one generated-output family for a caller repository from an uploaded artifact.
# Scope: public reusable workflow API.

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Actions artifact containing the prepared generated-output tree
        required: true
        type: string
      branch_suffix:
        description: Single validated suffix below dev/pr-N, prod, or rel/vX.Y.Z
        required: true
        type: string
      source_revision:
        description: Optional exact source revision override. Normally inferred from the triggering PR/head/tag context.
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  publish:
    name: Publish generated output
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: generated-output-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.branch_suffix }}
      cancel-in-progress: false

    steps:
      - name: Checkout exact publisher implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tool-git-project-publisher
          fetch-depth: 1
          persist-credentials: false

      - name: Download prepared output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/generated-output-publication

      - name: Publish prepared output
        uses: ./.tool-git-project-publisher/generated-output/publish
        with:
          source-directory: ${{ runner.temp }}/generated-output-publication
          branch-suffix: ${{ inputs.branch_suffix }}
          source-revision: ${{ inputs.source_revision }}
          token: ${{ github.token }}
