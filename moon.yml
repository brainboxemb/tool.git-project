tasks:
  cache.fixture:
    command: 'python fixture/moon/task.py'
    inputs:
      - 'fixture/moon/input.txt'
      - 'fixture/moon/task.py'
    outputs:
      - 'fixture/moon/out'
    options:
      cache: true

  cache.aggregate:
    script: ':'
    deps:
      - 'cache.fixture'
    inputs:
      - 'moon.yml'
      - '.moon/workspace.yml'
    options:
      cache: false
